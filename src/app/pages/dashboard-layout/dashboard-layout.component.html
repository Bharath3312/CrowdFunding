<div class="w-full space-y-6">
  <div class="rounded-2xl border border-slate-200 bg-white p-3 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <nav class="flex flex-wrap gap-2" aria-label="Dashboard sections">
      <a
        routerLink="/dashboard"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="bg-blue-600 text-white shadow-sm hover:bg-blue-600 dark:bg-blue-500 dark:text-white dark:hover:bg-blue-500"
        class="inline-flex items-center rounded-full px-4 py-2 text-sm font-medium text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-slate-100 dark:focus-visible:ring-offset-slate-900"
      >
        Overview
      </a>

      <a
        routerLink="/dashboard/my-campaigns"
        routerLinkActive="bg-blue-600 text-white shadow-sm hover:bg-blue-600 dark:bg-blue-500 dark:text-white dark:hover:bg-blue-500"
        class="inline-flex items-center rounded-full px-4 py-2 text-sm font-medium text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-slate-100 dark:focus-visible:ring-offset-slate-900"
      >
        My Campaigns
      </a>

      <a
        routerLink="/dashboard/my-contributions"
        routerLinkActive="bg-blue-600 text-white shadow-sm hover:bg-blue-600 dark:bg-blue-500 dark:text-white dark:hover:bg-blue-500"
        class="inline-flex items-center rounded-full px-4 py-2 text-sm font-medium text-slate-600 transition-all duration-200 hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-slate-100 dark:focus-visible:ring-offset-slate-900"
      >
        My Contributions
      </a>
    </nav>
  </div>

  <section class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900 sm:p-6">
    <router-outlet></router-outlet>
  </section>
</div>
