
<div  
     class="fixed inset-0 flex items-center justify-center z-50 bg-black bg-opacity-50">
  <div class="wallet-modal-content bg-white dark:bg-gray-800 rounded-lg shadow-xl border 
              border-gray-200 dark:border-gray-700 w-96 max-h-96 overflow-hidden animate-fade-in-down">

    <!-- Header -->
    <div class="p-4 border-b border-gray-200 dark:border-gray-700">
      <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Connect Wallet</h3>
      <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">
        Choose your preferred wallet to connect
      </p>
    </div>

    <!-- Body -->
    <div class="p-4">
      <!-- If Metamask Installed -->
      <div *ngIf="installedSupportedWallets; else install">
        <div *ngFor="let wallet of walletOptions"
             class="wallet-option flex items-center p-3 rounded-lg hover:bg-gray-50 
                    dark:hover:bg-gray-700 cursor-pointer transition-colors"
             (click)="selectWallet(wallet)">
          <div class="flex-shrink-0 w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-700 
                      flex items-center justify-center text-xl mr-3">
            <img [src]="wallet.icon" width="24" height="24" />
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-900 dark:text-white">{{ wallet.name }}</p>
          </div>
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </div>
      </div>

      <!-- If Metamask NOT Installed -->
      <ng-template #install>
        <div class="text-center">
          <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">
            MetaMask is not installed. Please install it to continue.
          </p>
          <a href="https://metamask.io/download.html" target="_blank"
             class="inline-block px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
            Install MetaMask
          </a>
        </div>
      </ng-template>
    </div>
  </div>
</div>
