    <div class="min-h-screen bg-gray-50 dark:bg-gray-900 py-12 px-4 sm:px-6 lg:px-8">
      <div class="max-w-4xl mx-auto">
        <div class="mb-8">
          <h1 class="text-4xl font-bold text-gray-900 dark:text-white mb-4">Create Campaign</h1>
          <p class="text-xl text-gray-600 dark:text-gray-300">Launch your next marketing campaign</p>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-theme p-8 border border-gray-200 dark:border-gray-700">
          <form class="space-y-6">
            <div>
              <label for="campaign-name" class="block text-sm font-medium text-gray-900 dark:text-white mb-2">
                Campaign Name
              </label>
              <input type="text" id="campaign-name" name="campaign-name"
                     class="w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                     placeholder="Enter campaign name">
            </div>

            <div>
              <label for="description" class="block text-sm font-medium text-gray-900 dark:text-white mb-2">
                Description
              </label>
              <textarea id="description" name="description" rows="4"
                        class="w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Describe your campaign"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label for="budget" class="block text-sm font-medium text-gray-900 dark:text-white mb-2">
                  Budget
                </label>
                <input type="number" id="budget" name="budget"
                       class="w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="Enter budget">
              </div>
              <div>
                <label for="duration" class="block text-sm font-medium text-gray-900 dark:text-white mb-2">
                  Duration (days)
                </label>
                <input type="number" id="duration" name="duration"
                       class="w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       placeholder="Enter duration">
              </div>
            </div>

            <div>
              <label for="target-audience" class="block text-sm font-medium text-gray-900 dark:text-white mb-2">
                Target Audience
              </label>
              <select id="target-audience" name="target-audience"
                      class="w-full px-3 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">Select target audience</option>
                <option value="young-adults">Young Adults (18-25)</option>
                <option value="professionals">Professionals (25-40)</option>
                <option value="families">Families</option>
                <option value="seniors">Seniors (60+)</option>
              </select>
            </div>

            <div class="flex justify-end space-x-4">
              <button type="button" class="bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 px-4 py-2 rounded-md text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200">
                Cancel
              </button>
              <button type="submit" class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-500 dark:hover:bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200">
                Create Campaign
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
